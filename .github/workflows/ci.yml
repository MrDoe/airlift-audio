name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: |
          pip install -e .
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: CLI smoke
        run: |
          airlift-audio --version
          airlift-cli devices
